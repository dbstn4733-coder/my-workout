<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 운동 기록장</title>
<style>
*{box-sizing:border-box}body{max-width:520px;margin:auto;padding:18px 14px 48px;background:#f5f7f5;color:#202820;font:16px/1.5 system-ui,sans-serif}
h1{font-size:28px;margin:0 0 16px}h2{font-size:20px}nav,.month{display:flex;align-items:center;gap:8px}
nav a,button,input,textarea{border:1px solid #a9bcac;border-radius:9px;padding:10px;background:white;color:inherit;font:inherit}
nav a{flex:1;text-align:center;text-decoration:none}nav a[aria-current],.primary,.days button[aria-pressed=true]{background:#24633d;color:white}
label{display:block;margin:14px 0 5px;font-weight:600}input,textarea,.primary{width:100%}textarea{display:block;resize:vertical}.primary{margin-top:12px}button{cursor:pointer}
.calendar,article{background:white;padding:14px;border:1px solid #d3ded4;border-radius:12px;margin:12px 0}
.month{justify-content:space-between}.month button{min-width:44px}.days,.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;gap:2px}
.week{font-size:14px;color:#546759;margin:14px 0 6px}.days button{position:relative;min-height:44px;padding:4px 0 10px;border-color:transparent}
.days button[data-record]::after{content:"";position:absolute;bottom:4px;left:calc(50% - 3px);width:6px;height:6px;background:currentColor;border-radius:50%}
.hint{color:#536858;font-size:14px;margin:10px 0 0}.entry{white-space:pre-wrap;overflow-wrap:anywhere}.delete{color:#922f2f}button:focus-visible,a:focus-visible{outline:3px solid #b77d19}
</style>
<h1>내 운동 기록장</h1>
<nav><a href="#write" id="writeLink">운동 쓰기</a><a href="#history" id="historyLink">날짜별 기록</a></nav>
<section id="writePage"><h2>운동 쓰기</h2>
<form id="form"><label for="date">운동한 날짜</label><input type="date" id="date" required>
<label for="note">운동 내용</label><textarea id="note" rows="9" required placeholder="데드리프트&#10;20kg 10회 1세트&#10;50kg 10회 2세트"></textarea>
<button class="primary">운동 기록 저장</button></form></section>
<section id="historyPage" hidden><h2>날짜별 기록</h2>
<div class="calendar"><div class="month"><button id="prev" aria-label="이전 달">‹</button><strong id="month"></strong><button id="next" aria-label="다음 달">›</button></div>
<div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
<div class="days" id="days"></div><p class="hint">● 운동 기록이 있는 날</p></div>
<button id="unknown" hidden>날짜를 알 수 없는 예전 기록</button>
<h2 id="summary"></h2><div id="entries"></div></section>
<p id="status" role="status"></p>
<script>
const el = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
function dateKey(d) {
  return [d.getFullYear(), pad(d.getMonth()+1), pad(d.getDate())].join("-");
}
const today = dateKey(new Date());
let selected = today;
let month = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
el("date").value = today;
function read() {
  const raw = localStorage.getItem("myWorkouts");
  return (raw === null ? [] : JSON.parse(raw)).map((item, index) => {
    if (typeof item !== "string") {
      if (!item || typeof item.text !== "string" || typeof item.id !== "string" || typeof item.date !== "string") throw Error();
      return item;
    }
    const parts = item.match(/^\s*(\d{4})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{1,2})/);
    const date = parts ? [parts[1],pad(parts[2]),pad(parts[3])].join("-") : "unknown";
    return {id:"old-"+index, date, text:item};
  });
}
function save(records) { localStorage.setItem("myWorkouts", JSON.stringify(records)); }
function render() {
  el("entries").replaceChildren();
  el("days").replaceChildren();
  el("summary").textContent = "";
  try {
    const records = read();
    const dates = new Set(records.map(r => r.date));
    const year = month.getFullYear(), m = month.getMonth();
    el("month").textContent = year+"년 "+(m+1)+"월";
    for (let i=0; i<month.getDay(); i++) el("days").append(document.createElement("span"));
    const last = new Date(year,m+1,0).getDate();
    for (let day=1; day<=last; day++) {
      const key = dateKey(new Date(year,m,day));
      const button = document.createElement("button");
      button.textContent = day;
      button.setAttribute("aria-pressed", String(selected === key));
      button.setAttribute("aria-label", key + (dates.has(key) ? " 운동 기록 있음" : ""));
      button.toggleAttribute("data-record",dates.has(key));
      button.onclick = () => { selected = key; render(); el("days").querySelector('[aria-pressed="true"]').focus(); };
      el("days").append(button);
    }
    el("unknown").hidden = !dates.has("unknown");
    const matches = records.filter(r => r.date === selected).reverse();
    el("summary").textContent = (selected === "unknown" ? "예전 기록" : selected)+" · 기록 "+matches.length+"개";
    if (!matches.length) el("entries").textContent = "이날 저장한 운동이 없어요.";
    for (const record of matches) {
      const card = document.createElement("article");
      const title = document.createElement("strong");
      title.textContent = record.time ? record.time+"에 저장" : "예전 운동 기록";
      const text = document.createElement("p");
      text.className = "entry";
      text.textContent = record.text;
      const remove = document.createElement("button");
      remove.className = "delete";
      remove.textContent = "이 기록 삭제";
      remove.onclick = () => {
        if (!confirm("이 운동 기록을 삭제할까요?\n\n"+record.text.slice(0,80))) return;
        try {
          save(read().filter(r => r.id !== record.id));
          render();
          el("status").textContent = "삭제했어요.";
        } catch { el("status").textContent = "기록을 삭제하지 못했어요."; }
      };
      card.append(title,text,remove);
      el("entries").append(card);
    }
  } catch { el("status").textContent = "저장된 기록을 읽지 못했어요."; }
}
function moveMonth(delta) {
  month = new Date(month.getFullYear(), month.getMonth()+delta, 1);
  selected = dateKey(month);
  render();
}
el("prev").onclick = () => moveMonth(-1);
el("next").onclick = () => moveMonth(1);
el("unknown").onclick = () => { selected = "unknown"; render(); };
el("form").onsubmit = event => {
  event.preventDefault();
  const text = el("note").value.trim();
  if (!text) { el("status").textContent = "운동 내용을 입력해 주세요."; return; }
  const date = el("date").value;
  try {
    const records = read();
    records.push({id:Date.now()+"-"+Math.random(), date, text,
      time:new Date().toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit"})});
    save(records);
    selected = date;
    month = new Date(date.slice(0,7)+"-01T00:00:00");
    el("note").value = "";
    el("status").textContent = date+" 운동을 저장했어요.";
  } catch { el("status").textContent = "저장하지 못했어요. 입력 내용을 복사해 보관해 주세요."; }
};
function showPage() {
  const history = location.hash === "#history";
  el("writePage").hidden = history;
  el("historyPage").hidden = !history;
  el("writeLink").removeAttribute("aria-current");
  el("historyLink").removeAttribute("aria-current");
  el(history ? "historyLink" : "writeLink").setAttribute("aria-current","page");
  el("status").textContent = "";
  if (history) render();
}
window.addEventListener("hashchange", showPage);
showPage();
</script>
</html>
