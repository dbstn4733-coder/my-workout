<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 운동 기록장</title>
<style>
*{box-sizing:border-box}body{max-width:520px;margin:auto;padding:18px 14px 48px;background:#f5f7f5;color:#202820;font:16px/1.5 system-ui,sans-serif}
h1{font-size:28px;margin:0 0 16px}h2{font-size:20px}nav,.month{display:flex;align-items:center;gap:8px}
nav a,button,input,textarea{border:1px solid #a9bcac;border-radius:9px;padding:10px;background:white;color:inherit;font:inherit}
nav a{flex:1;text-align:center;text-decoration:none}nav a[aria-current],.primary,.days button[aria-pressed=true]{background:#24633d;color:white}
label{display:block;margin:14px 0 5px;font-weight:600}input,textarea,.primary{width:100%}textarea{display:block;resize:vertical}.primary{margin-top:12px}button{cursor:pointer}
.calendar,article{background:white;padding:14px;border:1px solid #d3ded4;border-radius:12px;margin:12px 0}
.month{justify-content:space-between}.month button{min-width:44px}.days,.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;gap:2px}
.week{font-size:14px;color:#546759;margin:14px 0 6px}.days button{position:relative;min-height:44px;padding:4px 0 10px;border-color:transparent}
.days button[data-record]::after{content:"";position:absolute;bottom:4px;left:calc(50% - 3px);width:6px;height:6px;background:currentColor;border-radius:50%}
.hint{color:#536858;font-size:14px;margin:10px 0 0}.entry{white-space:pre-wrap;overflow-wrap:anywhere}.delete{color:#922f2f}button:focus-visible,a:focus-visible{outline:3px solid #b77d19}
details,fieldset{margin:14px 0;padding:12px;border:1px solid #c4d3c7;border-radius:10px;background:white;min-width:0}
summary{cursor:pointer;color:#245b37;font-weight:bold}select{width:100%;min-width:0;font:inherit;padding:9px 2px;border:1px solid #a9bcac;border-radius:8px;background:white}
.numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}fieldset label{margin:4px 0 8px}#register button{margin-top:8px}
.sticker{display:block;width:fit-content;max-width:100%;margin:2px auto;padding:1px 4px;background:#fff0c5;color:#523818;border-radius:6px;font-size:11px;line-height:1.4;font-weight:700}
</style>
<h1>내 운동 기록장</h1>
<nav><a href="#write" id="writeLink">운동 쓰기</a><a href="#history" id="historyLink">날짜별 기록</a></nav>
<section id="writePage"><h2>운동 쓰기</h2>
<details id="catalog"><summary>운동 이름 등록</summary>
<form id="register"><label for="newName">새 운동 이름</label>
<input id="newName" placeholder="예: 데드리프트" maxlength="80" required><button>등록</button></form></details>
<form id="form"><label for="date">운동한 날짜</label><input type="date" id="date" required>
<label for="area">주요 운동 부위</label><select id="area"></select><div id="rows"></div><button type="button" id="add">＋ 다른 운동 추가</button>
<button class="primary">운동 기록 저장</button></form></section>
<section id="historyPage" hidden><h2>날짜별 기록</h2>
<div class="calendar"><div class="month"><button id="prev" aria-label="이전 달">‹</button><strong id="month"></strong><button id="next" aria-label="다음 달">›</button></div>
<div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
<div class="days" id="days"></div><p class="hint">● 운동 기록이 있는 날</p></div>
<button id="unknown" hidden>날짜를 알 수 없는 예전 기록</button>
<h2 id="summary"></h2><div id="entries"></div></section>
<p id="status" role="status"></p>
<script>
const el = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
function dateKey(d) {
  return [d.getFullYear(), pad(d.getMonth()+1), pad(d.getDate())].join("-");
}
const today = dateKey(new Date());
let selected = today;
let month = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
el("date").value = today;
function read() {
  const raw = localStorage.getItem("myWorkouts");
  return (raw === null ? [] : JSON.parse(raw)).map((item, index) => {
    if (typeof item !== "string") {
      if (!item || typeof item.text !== "string" || typeof item.id !== "string" || typeof item.date !== "string") throw Error();
      return item;
    }
    const parts = item.match(/^\s*(\d{4})\s*[./-]\s*(\d{1,2})\s*[./-]\s*(\d{1,2})/);
    const date = parts ? [parts[1],pad(parts[2]),pad(parts[3])].join("-") : "unknown";
    return {id:"old-"+index, date, text:item};
  });
}
function save(records) { localStorage.setItem("myWorkouts", JSON.stringify(records)); }
const areas = ["가슴","등","어깨","팔","하체","복부","전신"];
function fillAreas(select, current = "") {
  select.add(new Option("선택 안 함", ""));
  for (const area of areas) select.add(new Option(area, area));
  select.value = current;
}
fillAreas(el("area"));
function editCard(card, record) {
  const form = document.createElement("form");
  form.innerHTML = '<label>운동한 날짜<input type="date" name="date"></label><label>주요 운동 부위<select name="area"></select></label><label>운동 내용<textarea rows="6" name="notes" required></textarea></label><button class="primary">수정 저장</button> <button type="button">취소</button>';
  const {date,area,notes} = form.elements;
  date.value = record.date === "unknown" ? "" : record.date;
  date.required = record.date !== "unknown";
  fillAreas(area, record.area);
  notes.value = record.text;
  form.querySelector('[type="button"]').onclick = render;
  form.onsubmit = event => {
    event.preventDefault();
    if (!notes.value.trim()) { notes.focus(); return; }
    try {
      const records = read();
      const item = records.find(r => r.id === record.id);
      if (!item) { render(); el("status").textContent = "이미 삭제된 기록이에요."; return; }
      Object.assign(item, {date:date.value || "unknown", area:area.value, text:notes.value});
      save(records);
      selected = item.date;
      if (date.value) month = new Date(date.value.slice(0,7)+"-01T00:00:00");
      render();
      el("status").textContent = "수정했어요.";
    } catch { el("status").textContent = "수정 내용을 저장하지 못했어요."; }
  };
  card.replaceChildren(form);
  notes.focus();
}
function render() {
  el("entries").replaceChildren();
  el("days").replaceChildren();
  el("summary").textContent = "";
  try {
    const records = read();
    const dates = new Set(records.map(r => r.date));
    const year = month.getFullYear(), m = month.getMonth();
    el("month").textContent = year+"년 "+(m+1)+"월";
    for (let i=0; i<month.getDay(); i++) el("days").append(document.createElement("span"));
    const last = new Date(year,m+1,0).getDate();
    for (let day=1; day<=last; day++) {
      const key = dateKey(new Date(year,m,day));
      const button = document.createElement("button");
      button.textContent = day;
      button.setAttribute("aria-pressed", String(selected === key));
      button.setAttribute("aria-label", key + (dates.has(key) ? " 운동 기록 있음" : ""));
      const stickers = [...new Set(records.filter(r => r.date === key && r.area).map(r => r.area))];
      if (stickers.length) button.setAttribute("aria-label", key+" 운동 기록: "+stickers.join(", "));
      for (const area of stickers) {
        const badge = document.createElement("span");
        badge.className = "sticker";
        badge.textContent = area;
        button.append(badge);
      }
      button.toggleAttribute("data-record",dates.has(key));
      button.onclick = () => { selected = key; render(); el("days").querySelector('[aria-pressed="true"]').focus(); };
      el("days").append(button);
    }
    el("unknown").hidden = !dates.has("unknown");
    const matches = records.filter(r => r.date === selected).reverse();
    el("summary").textContent = (selected === "unknown" ? "예전 기록" : selected)+" · 기록 "+matches.length+"개";
    if (!matches.length) el("entries").textContent = "이날 저장한 운동이 없어요.";
    for (const record of matches) {
      const card = document.createElement("article");
      const title = document.createElement("strong");
      title.textContent = record.time ? record.time+"에 저장" : "예전 운동 기록";
      const text = document.createElement("p");
      text.className = "entry";
      text.textContent = record.text;
      const remove = document.createElement("button");
      remove.className = "delete";
      remove.textContent = "이 기록 삭제";
      remove.onclick = () => {
        if (!confirm("이 운동 기록을 삭제할까요?\n\n"+record.text.slice(0,80))) return;
        try {
          save(read().filter(r => r.id !== record.id));
          render();
          el("status").textContent = "삭제했어요.";
        } catch { el("status").textContent = "기록을 삭제하지 못했어요."; }
      };
      if (record.area) title.textContent += " · "+record.area;
      const edit = document.createElement("button");
      edit.textContent = "기록 수정";
      edit.onclick = () => editCard(card, record);
      card.append(title,text,edit,remove);
      el("entries").append(card);
    }
  } catch { el("status").textContent = "저장된 기록을 읽지 못했어요."; }
}
function moveMonth(delta) {
  month = new Date(month.getFullYear(), month.getMonth()+delta, 1);
  selected = dateKey(month);
  render();
}
el("prev").onclick = () => moveMonth(-1);
el("next").onclick = () => moveMonth(1);
el("unknown").onclick = () => { selected = "unknown"; render(); };
function readNames() {
  const names = JSON.parse(localStorage.getItem("myWorkoutNames") || "[]");
  if (!Array.isArray(names) || !names.every(name => typeof name === "string")) throw Error();
  return names;
}
let names = [];
try { names = readNames(); } catch { /* Registration retries the read before writing. */ }
function setOptions(select, selected) {
  select.replaceChildren(new Option("운동 선택", ""));
  for (const name of names) select.add(new Option(name, name));
  select.value = selected;
}
function addRow() {
  const row = document.createElement("fieldset");
  row.innerHTML = '<legend>운동 항목</legend><label>운동 이름<select class="exercise" required></select></label><div class="sets"></div><button type="button" class="add-set">＋ 세트 줄 추가</button> <button type="button" class="remove-exercise">운동 항목 삭제</button>';
  setOptions(row.querySelector("select"), el("rows").children.length ? "" : names[0] || "");
  const sets = row.querySelector(".sets");
  addSet(sets);
  row.querySelector(".add-set").onclick = () => addSet(sets,rowValues(sets.lastElementChild));
  row.querySelector(".remove-exercise").onclick = () => {
    row.remove();
    if (!el("rows").children.length) addRow();
  };
  el("rows").append(row);
}
function addSet(sets,previous) {
  const line = document.createElement("div");
  line.className = "set-line";
  line.innerHTML = '<div class="numbers"></div><button type="button">이 줄 삭제</button>';
  const settings = [["무게 (kg)",0,300,0.5,20],["반복 수",1,100,1,10],["세트 수",1,30,1,1]];
  settings.forEach(([title,min,max,step,initial], index) => {
    const label = document.createElement("label");
    label.textContent = title;
    const select = document.createElement("select");
    for (let value=min; value<=max; value+=step) select.add(new Option(value,value));
    select.value = previous?.[index] ?? initial;
    label.append(select);
    line.querySelector(".numbers").append(label);
  });
  line.querySelector("button").onclick = () => {
    line.remove();
    if (sets.children.length === 1) sets.querySelector("button").hidden = true;
  };
  sets.append(line);
  for (const button of sets.querySelectorAll("button")) button.hidden = sets.children.length === 1;
}
function rowValues(row) {
  return Array.from(row.querySelectorAll("select"), select => select.value);
}
el("catalog").open = !names.length;
addRow();
el("add").onclick = addRow;
el("register").onsubmit = event => {
  event.preventDefault();
  const name = el("newName").value.trim();
  if (!name) { el("status").textContent = "운동 이름을 입력해 주세요."; return; }
  try {
    const updated = [...new Set([...readNames(), name])];
    localStorage.setItem("myWorkoutNames", JSON.stringify(updated));
    names = updated;
    for (const select of document.querySelectorAll(".exercise")) setOptions(select,select.value || name);
    el("newName").value = "";
    el("status").textContent = name+" 항목을 선택할 수 있어요.";
  } catch { el("status").textContent = "운동 이름을 저장하지 못했어요."; }
};
el("form").onsubmit = event => {
  event.preventDefault();
  const text = Array.from(el("rows").children, row => {
    const lines = Array.from(row.querySelectorAll(".set-line"), line => {
      const [weight,reps,sets] = rowValues(line);
      return weight+"kg "+reps+"회 "+sets+"세트";
    });
    return [row.querySelector(".exercise").value,...lines].join("\n");
  }).join("\n\n");
  const date = el("date").value;
  try {
    const records = read();
    records.push({id:Date.now()+"-"+Math.random(), date, text, area:el("area").value,
      time:new Date().toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit"})});
    save(records);
    selected = date;
    month = new Date(date.slice(0,7)+"-01T00:00:00");
    el("area").value = "";
    el("rows").replaceChildren();
    addRow();
    el("status").textContent = date+" 운동을 저장했어요.";
  } catch { el("status").textContent = "저장하지 못했어요. 입력 내용을 복사해 보관해 주세요."; }
};
function showPage() {
  const history = location.hash === "#history";
  el("writePage").hidden = history;
  el("historyPage").hidden = !history;
  el("writeLink").removeAttribute("aria-current");
  el("historyLink").removeAttribute("aria-current");
  el(history ? "historyLink" : "writeLink").setAttribute("aria-current","page");
  el("status").textContent = "";
  if (history) render();
}
window.addEventListener("hashchange", showPage);
showPage();
</script>
</html>
